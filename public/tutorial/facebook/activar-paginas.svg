<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t-act d-act" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t-act">Páginas de Facebook: habilitadas por defecto</title>
<desc id="d-act">Esquema de una terminal: las Páginas de Facebook vienen habilitadas; para apagarlas se inicia el programa con la variable de entorno SOCIAL_DESK_FACEBOOK_PAGES igual a 0. Se muestra la forma de PowerShell y la de bash. Para volver a habilitarlas se quita la variable y se reinicia el programa.</desc>
<rect x="0" y="0" width="800" height="450" fill="#eef1f6"/>
<rect x="40" y="20" width="720" height="176" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/><rect x="40" y="20" width="720" height="28" rx="10" fill="#1f2937"/><rect x="40" y="38" width="720" height="10" fill="#1f2937"/><circle cx="60" cy="34" r="5" fill="#6b7280"/><circle cx="78" cy="34" r="5" fill="#6b7280"/><circle cx="96" cy="34" r="5" fill="#6b7280"/><text x="120" y="38" font-size="11" fill="#9ca3af">Terminal</text><text x="64" y="76" font-size="12" fill="#9ca3af">Para apagarlas — PowerShell (Windows)</text><text x="64" y="100" font-size="14" fill="#e5e7eb" font-family="ui-monospace, Menlo, Consolas, monospace">PS&gt; $env:SOCIAL_DESK_FACEBOOK_PAGES = "0"; npm start</text><text x="64" y="142" font-size="12" fill="#9ca3af">Para apagarlas — bash (macOS, Linux)</text><text x="64" y="166" font-size="14" fill="#e5e7eb" font-family="ui-monospace, Menlo, Consolas, monospace">$ SOCIAL_DESK_FACEBOOK_PAGES=0 npm start</text><rect x="52" y="82" width="696" height="26" rx="6" fill="none" stroke="#fb923c" stroke-width="2.5"/><rect x="52" y="148" width="696" height="26" rx="6" fill="none" stroke="#fb923c" stroke-width="2.5"/><circle cx="52" cy="82" r="11" fill="#d9480f"/><text x="52" y="86.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><circle cx="52" cy="148" r="11" fill="#d9480f"/><text x="52" y="152.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><circle cx="70" cy="238" r="11" fill="#d9480f"/><text x="70" y="242.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="90" y="243" font-size="13" fill="#1f2937">Las Páginas vienen habilitadas: no necesitas hacer nada.</text><circle cx="70" cy="272" r="11" fill="#d9480f"/><text x="70" y="276.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="90" y="277" font-size="13" fill="#1f2937">Para apagarlas, inicia con SOCIAL_DESK_FACEBOOK_PAGES=0 (usa solo la línea de tu sistema).</text><circle cx="70" cy="306" r="11" fill="#d9480f"/><text x="70" y="310.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="90" y="311" font-size="13" fill="#1f2937">Para habilitarlas de nuevo, quita la variable y reinicia el programa.</text><rect x="60" y="340" width="680" height="34" rx="8" fill="#fff4e6" stroke="#d9480f" stroke-width="1.2"/><text x="400" y="362" font-size="12.5" fill="#1f2937" text-anchor="middle">Reiniciar la aplicación apaga el Monitoreo en cada arranque.</text>
<text x="400" y="440" font-size="12" fill="#4b5563" text-anchor="middle">Esquema ilustrativo — tu pantalla puede verse distinta</text>
</svg>
