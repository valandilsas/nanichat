<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t-confirm d-confirm" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t-confirm">Aviso de Meta: Es necesario confirmar la cuenta</title>
<desc id="d-confirm">Esquema del aviso que Meta puede mostrar: Es necesario confirmar la cuenta, Detectamos actividad inusual en esta cuenta de desarrollador, y el botón Confirmar cuenta resaltado.</desc>
<rect x="0" y="0" width="800" height="450" fill="#eef1f6"/>
<rect x="24" y="16" width="752" height="388" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/><rect x="24" y="16" width="752" height="30" rx="10" fill="#dde2ea"/><rect x="24" y="34" width="752" height="12" fill="#dde2ea"/><circle cx="42" cy="31" r="4.5" fill="#9aa3b2"/><circle cx="58" cy="31" r="4.5" fill="#9aa3b2"/><circle cx="74" cy="31" r="4.5" fill="#9aa3b2"/><rect x="120" y="22" width="380" height="18" rx="9" fill="#ffffff"/><text x="132" y="35" font-size="11" fill="#4b5563">developers.facebook.com</text><rect x="150" y="92" width="500" height="250" rx="12" fill="#ffffff" stroke="#b9c1ce" stroke-width="2"/><circle cx="400" cy="126" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="400" y="133" font-size="20" fill="#b45309" font-weight="700" text-anchor="middle">!</text><text x="400" y="172" font-size="17" fill="#1f2937" font-weight="700" text-anchor="middle">Es necesario confirmar la cuenta</text><text x="400" y="200" font-size="13" fill="#4b5563" text-anchor="middle">Detectamos actividad inusual en esta cuenta de desarrollador.</text><text x="400" y="217" font-size="13" fill="#4b5563" text-anchor="middle">Completa los pasos de confirmación para recuperar el acceso.</text><rect x="320" y="258" width="160" height="34" rx="6" fill="#1d4ed8"/><text x="400" y="279.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Confirmar cuenta</text><rect x="316" y="254" width="168" height="42" rx="9" fill="none" stroke="#d9480f" stroke-width="3"/><circle cx="316" cy="254" r="11" fill="#d9480f"/><text x="316" y="258.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="180" cy="318" r="10" fill="#d9480f"/><text x="180" y="322" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="198" y="322" font-size="13" fill="#1f2937">Complétalo tú mismo, sin scripts ni herramientas automáticas.</text><text x="180" y="372" font-size="12" fill="#4b5563">Después espera un tiempo y evita navegar por las páginas de Meta de forma automatizada.</text>

<text x="400" y="430" font-size="12" fill="#4b5563" text-anchor="middle">Esquema ilustrativo — tu pantalla puede verse distinta</text>
</svg>
