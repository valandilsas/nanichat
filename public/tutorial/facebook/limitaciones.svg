<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t-lim d-lim" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t-lim">Qué hace y qué no hace el programa con tu Página</title>
<desc id="d-lim">Resumen en dos columnas. Hoy funciona: respuesta privada, una por persona y dentro de 7 días; los botones de enlace se envían como texto simple; los comentarios de personas sin rol en tu app llegan sin nombre. Todavía no hay: respuesta pública, moderación, ocultar ni borrar, ni lectura verificada del mensaje. Si otra herramienta responde a los mismos comentarios, desactívala antes.</desc>
<rect x="0" y="0" width="800" height="450" fill="#eef1f6"/>
<text x="400" y="38" font-size="19" fill="#1f2937" font-weight="700" text-anchor="middle">Facebook funciona distinto de Instagram</text><rect x="30" y="54" width="360" height="266" rx="10" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/><rect x="30" y="54" width="360" height="34" rx="10" fill="#e6f6ea"/><rect x="30" y="76" width="360" height="12" fill="#e6f6ea"/><text x="210" y="77" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Qué funciona hoy</text><text x="48" y="118" font-size="14.5" fill="#1f2937">Respuesta privada: una por persona,</text><text x="48" y="140" font-size="14.5" fill="#1f2937">dentro de 7 días del comentario.</text><text x="48" y="177" font-size="14.5" fill="#1f2937">Los botones de enlace se envían</text><text x="48" y="199" font-size="14.5" fill="#1f2937">como texto simple.</text><text x="48" y="235" font-size="14.5" fill="#1f2937">Comentarios de personas sin rol en tu</text><text x="48" y="257" font-size="14.5" fill="#1f2937">app: llegan sin nombre y {{username}}</text><text x="48" y="279" font-size="14.5" fill="#1f2937">se reemplaza por un saludo sin nombre.</text><rect x="410" y="54" width="360" height="266" rx="10" fill="#ffffff" stroke="#c92a2a" stroke-width="2"/><rect x="410" y="54" width="360" height="34" rx="10" fill="#fdeaea"/><rect x="410" y="76" width="360" height="12" fill="#fdeaea"/><text x="590" y="77" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Qué todavía no hay</text><text x="428" y="118" font-size="14.5" fill="#1f2937">Respuesta pública.</text><text x="428" y="155" font-size="14.5" fill="#1f2937">Moderación.</text><text x="428" y="191" font-size="14.5" fill="#1f2937">Ocultar o borrar comentarios.</text><text x="428" y="228" font-size="14.5" fill="#1f2937">Lectura verificada del mensaje enviado:</text><text x="428" y="250" font-size="14.5" fill="#1f2937">Facebook no la permite; se confirma</text><text x="428" y="272" font-size="14.5" fill="#1f2937">con la respuesta de Meta.</text><rect x="30" y="336" width="740" height="52" rx="8" fill="#fff4e6" stroke="#d9480f" stroke-width="1.5"/><circle cx="54" cy="362" r="11" fill="#d9480f"/><text x="54" y="366.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">!</text><text x="76" y="358" font-size="14" fill="#1f2937">Si otra herramienta responde a los mismos comentarios,</text><text x="76" y="378" font-size="14" fill="#1f2937">desactívala antes de usar este programa en esa Página.</text>
<text x="400" y="438" font-size="12" fill="#4b5563" text-anchor="middle">Esquema ilustrativo — tu pantalla puede verse distinta</text>
</svg>
