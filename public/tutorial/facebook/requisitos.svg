<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t-req d-req" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t-req">Qué necesitas para empezar con Facebook</title>
<desc id="d-req">Esquema: tu usuario de Facebook administra tu Página con control total, o al menos con las tareas Mensajes y Moderar. Ten a mano teléfono y correo para los códigos de verificación. La cuenta de desarrollador, la app y el portafolio opcional se crean en los pasos siguientes.</desc>
<rect x="0" y="0" width="800" height="450" fill="#eef1f6"/>
<text x="400" y="44" font-size="20" fill="#1f2937" font-weight="700" text-anchor="middle">Antes de empezar</text><rect x="60" y="70" width="300" height="92" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/><text x="210" y="100" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Tu usuario de Facebook</text><text x="210" y="122" font-size="12" fill="#4b5563" text-anchor="middle">La persona que administra</text><text x="210" y="140" font-size="12" fill="#4b5563" text-anchor="middle">la Página</text><line x1="360" y1="116" x2="430" y2="116" stroke="#6b7280" stroke-width="2.5"/><polygon points="430,109 430,123 440,116" fill="#6b7280"/><rect x="440" y="70" width="300" height="92" rx="10" fill="#dbe7ff" stroke="#1d4ed8" stroke-width="2"/><text x="590" y="98" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Tu Página de Facebook</text><text x="590" y="120" font-size="12" fill="#1f2937" text-anchor="middle">Control total, o al menos las</text><text x="590" y="138" font-size="12" fill="#1f2937" text-anchor="middle">tareas Mensajes y Moderar</text><circle cx="440" cy="70" r="11" fill="#d9480f"/><text x="440" y="74.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="60" y="190" width="300" height="76" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/><text x="210" y="218" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Teléfono y correo a mano</text><text x="210" y="240" font-size="12" fill="#4b5563" text-anchor="middle">Meta envía códigos de verificación</text><circle cx="60" cy="190" r="11" fill="#d9480f"/><text x="60" y="194.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="400" y="300" font-size="13" fill="#4b5563" font-weight="700" text-anchor="middle">Se crean en los pasos siguientes</text><rect x="60" y="314" width="200" height="52" rx="10" fill="#f6f8fb" stroke="#9aa3b2" stroke-width="1.5" stroke-dasharray="6 4"/><text x="160" y="336" font-size="13" fill="#1f2937" text-anchor="middle">Cuenta de desarrollador</text><text x="160" y="354" font-size="11.5" fill="#4b5563" text-anchor="middle">de Meta</text><rect x="300" y="314" width="200" height="52" rx="10" fill="#f6f8fb" stroke="#9aa3b2" stroke-width="1.5" stroke-dasharray="6 4"/><text x="400" y="336" font-size="13" fill="#1f2937" text-anchor="middle">App de Meta</text><text x="400" y="354" font-size="11.5" fill="#4b5563" text-anchor="middle">con tu cuenta</text><rect x="540" y="314" width="200" height="52" rx="10" fill="#f6f8fb" stroke="#9aa3b2" stroke-width="1.5" stroke-dasharray="6 4"/><text x="640" y="336" font-size="13" fill="#1f2937" text-anchor="middle">Portafolio comercial</text><text x="640" y="354" font-size="11.5" fill="#4b5563" text-anchor="middle">(opcional)</text><circle cx="70" cy="396" r="11" fill="#d9480f"/><text x="70" y="400.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="88" y="400" font-size="13" fill="#1f2937">Confirma que administras la Página.</text><circle cx="400" cy="396" r="11" fill="#d9480f"/><text x="400" y="400.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="418" y="400" font-size="13" fill="#1f2937">Ten a mano teléfono y correo.</text>
<text x="400" y="438" font-size="12" fill="#4b5563" text-anchor="middle">Esquema ilustrativo — tu pantalla puede verse distinta</text>
</svg>
