<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t-explorer d-explorer" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t-explorer">Explorador de la API Graph: elegir app, token de usuario y permisos</title>
<desc id="d-explorer">Esquema del Explorador de la API Graph: barra superior con GET, la ruta, la versión v26.0 y Enviar; panel derecho con Token de acceso, Generate Access Token, App de Meta, Usuario o página, Permisos y Agregar un permiso. Cuatro llamadas numeradas indican el orden.</desc>
<rect x="0" y="0" width="800" height="450" fill="#eef1f6"/>
<rect x="24" y="16" width="752" height="388" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/><rect x="24" y="16" width="752" height="30" rx="10" fill="#dde2ea"/><rect x="24" y="34" width="752" height="12" fill="#dde2ea"/><circle cx="42" cy="31" r="4.5" fill="#9aa3b2"/><circle cx="58" cy="31" r="4.5" fill="#9aa3b2"/><circle cx="74" cy="31" r="4.5" fill="#9aa3b2"/><rect x="120" y="22" width="380" height="18" rx="9" fill="#ffffff"/><text x="132" y="35" font-size="11" fill="#4b5563">developers.facebook.com/tools/explorer</text><rect x="40" y="60" width="64" height="28" rx="6" fill="#475569"/><text x="72" y="78.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">GET</text><rect x="112" y="60" width="260" height="28" rx="6" fill="#ffffff" stroke="#c3cad6" stroke-width="1"/><text x="122" y="79" font-size="12" fill="#4b5563">me/accounts</text><rect x="380" y="60" width="64" height="28" rx="6" fill="#ffffff" stroke="#c3cad6" stroke-width="1"/><text x="412" y="79" font-size="12" fill="#1f2937" text-anchor="middle">v26.0</text><rect x="452" y="60" width="60" height="28" rx="6" fill="#1d4ed8"/><text x="482" y="78.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Enviar</text><rect x="40" y="104" width="440" height="288" rx="6" fill="#f6f8fb" stroke="#c3cad6" stroke-width="1"/><rect x="56" y="122" width="200" height="10" rx="4" fill="#dde2ea"/><rect x="56" y="142" width="280" height="10" rx="4" fill="#dde2ea"/><rect x="56" y="162" width="160" height="10" rx="4" fill="#dde2ea"/><rect x="526" y="98" width="238" height="298" rx="8" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/><text x="540" y="118" font-size="13" fill="#1f2937" font-weight="700">Token de acceso</text><rect x="540" y="126" width="210" height="22" rx="6" fill="#f1f4f9" stroke="#c3cad6" stroke-width="1"/><text x="548" y="141" font-size="12" fill="#4b5563">••••••••••</text><rect x="540" y="154" width="210" height="28" rx="6" fill="#1d4ed8"/><text x="645" y="172.5" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Generate Access Token</text><text x="540" y="202" font-size="11" fill="#4b5563">App de Meta</text><rect x="540" y="208" width="210" height="24" rx="6" fill="#ffffff" stroke="#b9c1ce" stroke-width="1.2"/><text x="550" y="224" font-size="12" fill="#1f2937">Nombre de tu app</text><text x="540" y="252" font-size="11" fill="#4b5563">Usuario o página</text><rect x="540" y="258" width="210" height="52" rx="6" fill="#ffffff" stroke="#b9c1ce" stroke-width="1.2"/><text x="550" y="274" font-size="10.5" fill="#1f2937" font-weight="700">Obtener token de acceso de usuario</text><text x="550" y="298" font-size="11" fill="#4b5563">Tokens de acceso a la página</text><rect x="540" y="320" width="100" height="20" rx="5" fill="#dbe7ff"/><text x="590" y="334" font-size="11" fill="#1d4ed8" text-anchor="middle">Permissions</text><rect x="646" y="320" width="104" height="20" rx="5" fill="#f1f4f9"/><text x="698" y="334" font-size="11" fill="#4b5563" text-anchor="middle">Configurations</text><text x="540" y="360" font-size="12" fill="#1f2937" font-weight="700">Permisos</text><rect x="540" y="366" width="210" height="22" rx="6" fill="#ffffff" stroke="#b9c1ce" stroke-width="1.2"/><text x="550" y="381" font-size="11" fill="#4b5563">Agregar un permiso</text><rect x="536" y="204" width="218" height="32" rx="9" fill="none" stroke="#d9480f" stroke-width="3"/><circle cx="754" cy="204" r="11" fill="#d9480f"/><text x="754" y="208.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="536" y="254" width="218" height="60" rx="9" fill="none" stroke="#d9480f" stroke-width="3"/><circle cx="754" cy="254" r="11" fill="#d9480f"/><text x="754" y="258.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="536" y="362" width="218" height="30" rx="9" fill="none" stroke="#d9480f" stroke-width="3"/><circle cx="754" cy="362" r="11" fill="#d9480f"/><text x="754" y="366.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><rect x="536" y="150" width="218" height="36" rx="9" fill="none" stroke="#d9480f" stroke-width="3"/><circle cx="754" cy="150" r="11" fill="#d9480f"/><text x="754" y="154.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><circle cx="60" cy="220" r="10" fill="#d9480f"/><text x="60" y="224" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="78" y="224" font-size="13" fill="#1f2937">Elige tu app en «App de Meta».</text><circle cx="60" cy="249" r="10" fill="#d9480f"/><text x="60" y="253" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="78" y="253" font-size="13" fill="#1f2937">En «Usuario o página» elige «Obtener token de</text><text x="78" y="270" font-size="13" fill="#1f2937">acceso de usuario».</text><circle cx="60" cy="295" r="10" fill="#d9480f"/><text x="60" y="299" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="78" y="299" font-size="13" fill="#1f2937">Con «Agregar un permiso» añade los cuatro permisos</text><text x="78" y="316" font-size="13" fill="#1f2937">de Página (los obligatorios).</text><circle cx="60" cy="341" r="10" fill="#d9480f"/><text x="60" y="345" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="78" y="345" font-size="13" fill="#1f2937">Pulsa «Generate Access Token» y, en la ventana de</text><text x="78" y="362" font-size="13" fill="#1f2937">Facebook, marca tu Página.</text>

<text x="400" y="430" font-size="12" fill="#4b5563" text-anchor="middle">Esquema ilustrativo — tu pantalla puede verse distinta</text>
</svg>
