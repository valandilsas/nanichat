<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t-portfolio d-portfolio" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t-portfolio">Portafolio comercial: opcional para tu propia cuenta</title>
<desc id="d-portfolio">Esquema de decisión: al crear la app Meta pregunta si se conecta un portafolio comercial; puedes omitirlo con tu propia cuenta o crearlo si Meta lo exige.</desc>
<rect x="0" y="0" width="800" height="450" fill="#eef1f6"/>
<rect x="24" y="16" width="752" height="388" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/><rect x="24" y="16" width="752" height="30" rx="10" fill="#dde2ea"/><rect x="24" y="34" width="752" height="12" fill="#dde2ea"/><circle cx="42" cy="31" r="4.5" fill="#9aa3b2"/><circle cx="58" cy="31" r="4.5" fill="#9aa3b2"/><circle cx="74" cy="31" r="4.5" fill="#9aa3b2"/><rect x="120" y="22" width="380" height="18" rx="9" fill="#ffffff"/><text x="132" y="35" font-size="11" fill="#4b5563">developers.facebook.com/apps</text><rect x="60" y="150" width="170" height="72" rx="10" fill="#ffffff" stroke="#b9c1ce" stroke-width="1.5"/><text x="76" y="178" font-size="13" fill="#1f2937">Crear app</text><text x="76" y="195" font-size="13" fill="#1f2937">Paso «Portafolio»</text><circle cx="60" cy="150" r="11" fill="#d9480f"/><text x="60" y="154.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><path d="M236 186 H292" stroke="#4b5563" stroke-width="2" fill="none"/><path d="M290 181 l8 5 l-8 5 z" fill="#4b5563"/><rect x="300" y="150" width="190" height="72" rx="10" fill="#fff7ed" stroke="#d9480f" stroke-width="2"/><text x="314" y="176" font-size="13" fill="#1f2937" font-weight="700">¿Conectar un</text><text x="314" y="193" font-size="13" fill="#1f2937" font-weight="700">portafolio comercial?</text><circle cx="300" cy="150" r="11" fill="#d9480f"/><text x="300" y="154.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><path d="M496 168 H530 V132 H556" stroke="#4b5563" stroke-width="2" fill="none"/><path d="M554 127 l8 5 l-8 5 z" fill="#4b5563"/><path d="M496 204 H530 V240 H556" stroke="#4b5563" stroke-width="2" fill="none"/><path d="M554 235 l8 5 l-8 5 z" fill="#4b5563"/><rect x="566" y="100" width="190" height="64" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/><text x="578" y="126" font-size="12" fill="#1f2937">Omitir: cuenta propia,</text><text x="578" y="142" font-size="12" fill="#1f2937">acceso estándar (lo</text><text x="578" y="158" font-size="12" fill="#1f2937">habitual)</text><rect x="566" y="210" width="190" height="64" rx="10" fill="#ffffff" stroke="#b9c1ce" stroke-width="1.5"/><text x="578" y="236" font-size="12" fill="#1f2937">Crear o vincular: si Meta</text><text x="578" y="252" font-size="12" fill="#1f2937">lo exige en tu caso</text><text x="60" y="322" font-size="12.5" fill="#4b5563">Solo es obligatorio para atender cuentas de terceras personas (acceso avanzado) o con el permiso</text><text x="60" y="338.5" font-size="12.5" fill="#4b5563">business_management.</text><text x="60" y="366" font-size="12.5" fill="#4b5563">Enlace útil: business.facebook.com/settings (Configuración comercial de Meta).</text>
<rect x="584" y="54" width="176" height="24" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="672" y="70" font-size="12" fill="#78350f" font-weight="700" text-anchor="middle">Esquema por verificar</text>
<text x="400" y="430" font-size="12" fill="#4b5563" text-anchor="middle">Esquema ilustrativo — tu pantalla puede verse distinta</text>
</svg>
