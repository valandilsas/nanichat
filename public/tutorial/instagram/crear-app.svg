<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t-apps d-apps" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t-apps">Lista de apps de Meta con el botón Crear app</title>
<desc id="d-apps">Esquema del panel de apps de Meta: el encabezado Mis apps, una tarjeta de app de ejemplo con Modo: Publicada y el botón verde Crear app resaltado en la esquina superior derecha.</desc>
<rect x="0" y="0" width="800" height="450" fill="#eef1f6"/>
<rect x="24" y="16" width="752" height="388" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/><rect x="24" y="16" width="752" height="30" rx="10" fill="#dde2ea"/><rect x="24" y="34" width="752" height="12" fill="#dde2ea"/><circle cx="42" cy="31" r="4.5" fill="#9aa3b2"/><circle cx="58" cy="31" r="4.5" fill="#9aa3b2"/><circle cx="74" cy="31" r="4.5" fill="#9aa3b2"/><rect x="120" y="22" width="380" height="18" rx="9" fill="#ffffff"/><text x="132" y="35" font-size="11" fill="#4b5563">developers.facebook.com/apps</text><text x="60" y="96" font-size="22" fill="#1f2937" font-weight="700">Mis apps</text><rect x="640" y="70" width="110" height="34" rx="6" fill="#15803d"/><text x="695" y="91.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Crear app</text><rect x="60" y="130" width="330" height="120" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/><rect x="76" y="146" width="44" height="44" rx="10" fill="#b9c1ce"/><rect x="132" y="152" width="150" height="12" rx="4" fill="#dde2ea"/><rect x="132" y="174" width="90" height="10" rx="4" fill="#dde2ea"/><text x="76" y="226" font-size="12" fill="#4b5563">Modo: Publicada</text><rect x="410" y="130" width="330" height="120" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1"/><rect x="426" y="146" width="44" height="44" rx="10" fill="#dde2ea"/><rect x="482" y="152" width="130" height="12" rx="4" fill="#dde2ea"/><rect x="482" y="174" width="80" height="10" rx="4" fill="#dde2ea"/><rect x="636" y="66" width="118" height="42" rx="9" fill="none" stroke="#d9480f" stroke-width="3"/><circle cx="636" cy="66" r="11" fill="#d9480f"/><text x="636" y="70.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><circle cx="70" cy="296" r="10" fill="#d9480f"/><text x="70" y="300" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="88" y="300" font-size="13" fill="#1f2937">Pulsa «Crear app», escribe el nombre de la app y tu correo de</text><text x="88" y="317" font-size="13" fill="#1f2937">contacto, y sigue el asistente.</text><circle cx="70" cy="342" r="10" fill="#d9480f"/><text x="70" y="346" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="88" y="346" font-size="13" fill="#1f2937">Tus apps anteriores (si las hay) aparecen como tarjetas; no</text><text x="88" y="363" font-size="13" fill="#1f2937">necesitas tocarlas.</text>

<text x="400" y="430" font-size="12" fill="#4b5563" text-anchor="middle">Esquema ilustrativo — tu pantalla puede verse distinta</text>
</svg>
