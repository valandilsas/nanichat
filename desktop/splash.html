<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>NaniChat</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #475569; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #f1f5f9; --muted: #94a3b8; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    .spinner { width: 36px; height: 36px; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
    h1 { margin: 0; font-size: 20px; font-weight: 600; }
    p { margin: 0; font-size: 14px; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  </style>
</head>
<body>
  <main>
    <div class="spinner" role="progressbar" aria-label="Cargando"></div>
    <h1>Iniciando NaniChat...</h1>
    <p>Esto puede tardar unos segundos.</p>
  </main>
</body>
</html>
